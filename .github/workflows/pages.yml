# 把 site/ 部署到 GitHub Pages。
# 仓库 Settings → Pages → Source 必须选 GitHub Actions。
# GITHUB_TOKEN 没有 administration 权限，这个工作流不能替你打开 Pages。

name: 部署 GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
